server:
  shutdown: graceful

spring:
  application:
    name: payment-ledger-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_ledger}
    username: ${DB_USERNAME:payment_ledger}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # PSP statements are uploaded whole; a month of a busy merchant fits well within this.
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true

payment:
  # Processing fee kept from each capture, in basis points (290 = 2.90%).
  fee-basis-points: 290

outbox:
  relay:
    enabled: true
    poll-interval: 1s
    batch-size: 100
  retry:
    base-delay: 1s
    max-delay: 5m
    max-attempts: 10
