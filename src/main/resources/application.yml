server:
  shutdown: graceful

spring:
  application:
    name: payment-ledger-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_ledger}
    username: ${DB_USERNAME:payment_ledger}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # PSP statements are uploaded whole; a month of a busy merchant fits well within this.
      max-file-size: 20MB
      max-request-size: 20MB

management:
  # Health and metrics are unauthenticated, so they get their own port, kept off the public network.
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true

ledger:
  # Clearing, fee revenue and each merchant payable are split into this many accounts so that
  # concurrent captures do not queue on one row. Raising it later is safe for totals.
  account-shards: 16

payment:
  # Processing fee kept from each capture, in basis points (290 = 2.90%).
  fee-basis-points: 290

outbox:
  relay:
    enabled: true
    poll-interval: 1s
    batch-size: 100
    lease: 60s
  retry:
    base-delay: 1s
    max-delay: 5m
    max-attempts: 10
  retention:
    period: 30d
    batch-size: 5000
    cron: "0 30 3 * * *"

idempotency:
  # Clients may retry with the same key for this long.
  retention:
    period: 7d
    batch-size: 5000
    cron: "0 45 3 * * *"

# API clients. Supply them from the environment or a secret store, for example
#   SECURITY_CLIENTS_0_ID=checkout
#   SECURITY_CLIENTS_0_KEY_SHA256=<hex SHA-256 of the key>[,<hash of the next key>]
#   SECURITY_CLIENTS_0_ROLES=PAYMENTS
# Roles: PAYMENTS (/payments) and BACK_OFFICE (/reconciliations, /outbox).
security:
  clients: []
